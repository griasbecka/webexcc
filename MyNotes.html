<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>MyNotes</title>
  <style>
    :root { color-scheme: light; --bg:#f5f6f8; --surface:#fff; --ink:#20252b; --muted:#68727d; --line:#dce1e6; --accent:#1459bc; --hover:#edf3fc; --active:#dceaff; --focus:#3478d4; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    main { width:100%; max-width:1100px; height:100%; min-height:260px; margin:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { font-size:18px; line-height:1.3; margin:0; font-weight:650; letter-spacing:-.35px; }
    button { font:inherit; cursor:pointer; border:1px solid transparent; border-radius:6px; color:var(--ink); background:transparent; }
    button:focus-visible, #notes:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    #copy { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 14px; background:var(--accent); color:#fff; font-weight:600; }
    #copy:hover { filter:brightness(.93); }
    #copy:disabled { opacity:.6; cursor:wait; }
    .copy-icon { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; }
    .sheet { display:flex; flex-direction:column; min-height:0; flex:1; border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:hidden; }
    #toolbar { padding:7px 9px; display:flex; flex-wrap:wrap; align-items:center; gap:3px; border-bottom:1px solid var(--line); }
    #toolbar button { min-width:34px; min-height:34px; padding:4px 8px; line-height:1; font-size:16px; }
    #toolbar button:hover { background:var(--hover); }
    #toolbar button[aria-pressed="true"] { color:var(--accent); background:var(--active); }
    .divider { height:20px; width:1px; margin:0 5px; background:var(--line); }
    .list-icon { display:inline-block; font-size:16px; line-height:1; letter-spacing:1px; }
    #notes { flex:1; min-height:150px; overflow:auto; padding:18px 20px; outline:none; overflow-wrap:anywhere; white-space:normal; }
    #notes:focus { box-shadow:inset 0 0 0 2px var(--focus); }
    #notes:empty::before { content:attr(data-placeholder); color:var(--muted); pointer-events:none; }
    #notes p, #notes div { margin:0 0 .5em; }
    #notes ul, #notes ol { margin:.4em 0; padding-left:1.65em; }
    #notes li { margin:.15em 0; }
    #status { min-height:22px; margin:0; color:var(--muted); font-size:12px; }
    #status[data-state="error"] { color:#b63524; }
    @media(max-width:420px) { main { padding:10px; gap:9px; } #notes { padding:14px; } #toolbar { padding:5px; } #copy { padding:8px 11px; } }
    @media(prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#171b20; --surface:#22272e; --ink:#ecf0f5; --muted:#a5afbc; --line:#414852; --accent:#377ddd; --hover:#2c394c; --active:#263f61; --focus:#85b5ff; } #status[data-state="error"] { color:#ffaaa0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>MyNotes</h1>
      <button id="copy" type="button" title="Gesamte Notiz kopieren">
        <svg class="copy-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="10" height="11" rx="2"/><path d="M4 13H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v1"/></svg>
        Kopieren
      </button>
    </header>
    <section class="sheet" aria-label="Notizen">
      <div id="toolbar" role="toolbar" aria-label="Text formatieren">
        <button type="button" data-command="bold" aria-label="Fett" title="Fett (Strg+B)" aria-pressed="false"><b aria-hidden="true">B</b></button>
        <button type="button" data-command="italic" aria-label="Kursiv" title="Kursiv (Strg+I)" aria-pressed="false"><i aria-hidden="true">I</i></button>
        <button type="button" data-command="underline" aria-label="Unterstrichen" title="Unterstrichen (Strg+U)" aria-pressed="false"><u aria-hidden="true">U</u></button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" data-command="insertUnorderedList" aria-label="Aufzählungszeichen" title="Aufzählungszeichen" aria-pressed="false"><span class="list-icon" aria-hidden="true">• ≡</span></button>
        <button type="button" data-command="insertOrderedList" aria-label="Nummerierte Liste" title="Nummerierte Liste" aria-pressed="false"><span class="list-icon" aria-hidden="true">1. ≡</span></button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" data-command="undo" aria-label="Rückgängig" title="Rückgängig (Strg+Z)"><span aria-hidden="true">↶</span></button>
        <button type="button" data-command="redo" aria-label="Wiederholen" title="Wiederholen"><span aria-hidden="true">↷</span></button>
        <button type="button" data-command="removeFormat" aria-label="Textformatierung entfernen" title="Textformatierung entfernen"><span aria-hidden="true">T̸</span></button>
      </div>
      <div id="notes" contenteditable="true" role="textbox" aria-label="Gesprächsnotizen" aria-multiline="true" spellcheck="true" data-placeholder="Hier deine Notizen zum Gespräch eingeben …"></div>
    </section>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script>
    (() => {
      'use strict';
      const editor = document.getElementById('notes');
      const toolbar = document.getElementById('toolbar');
      const copyButton = document.getElementById('copy');
      const status = document.getElementById('status');
      const storageKey = 'mynotes.draft.v1';
      let savedRange = null;

      // A session-only draft survives reloads; no requests or permanent storage.
      try {
        const draft = sessionStorage.getItem(storageKey);
        if (draft) editor.append(cleanFragment(draft));
      } catch (_) { /* The editor also works when embedded storage is blocked. */ }

      function message(text, error = false) {
        status.textContent = text;
        status.dataset.state = error ? 'error' : 'ok';
      }

      function rememberSelection() {
        const selection = window.getSelection();
        if (selection.rangeCount && editor.contains(selection.anchorNode) && editor.contains(selection.focusNode)) {
          savedRange = selection.getRangeAt(0).cloneRange();
        }
      }

      function restoreSelection() {
        editor.focus();
        const selection = window.getSelection();
        selection.removeAllRanges();
        if (savedRange && editor.contains(savedRange.startContainer) && editor.contains(savedRange.endContainer)) {
          selection.addRange(savedRange);
        } else {
          const range = document.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
          selection.addRange(range);
        }
      }

      function refreshToolbar() {
        for (const button of toolbar.querySelectorAll('[aria-pressed]')) {
          let active = false;
          try { active = document.queryCommandState(button.dataset.command); } catch (_) { /* Unsupported command. */ }
          button.setAttribute('aria-pressed', String(active));
        }
      }

      function saveDraft() {
        try { sessionStorage.setItem(storageKey, editor.innerHTML); } catch (_) { /* No storage required. */ }
      }

      function changed() {
        // Remove leftover empty blocks so the input placeholder can reappear.
        if (!editor.textContent.trim() && !editor.querySelector('li')) editor.replaceChildren();
        rememberSelection();
        refreshToolbar();
        saveDraft();
        message('');
      }

      // Keep only the supported rich-text structure when pasting or restoring.
      // Content is parsed in an inert template; no external images or scripts run.
      function cleanFragment(html) {
        const template = document.createElement('template');
        template.innerHTML = html;
        const allowed = new Set(['B','STRONG','I','EM','U','UL','OL','LI','P','DIV','BR']);
        const discard = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','IMG','VIDEO','AUDIO','LINK','META','TEMPLATE','INPUT','BUTTON','TEXTAREA','SELECT']);
        function clean(node) {
          if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent);
          const fragment = document.createDocumentFragment();
          if (node.nodeType !== Node.ELEMENT_NODE || discard.has(node.tagName)) return fragment;
          for (const child of node.childNodes) fragment.append(clean(child));
          let result = fragment;
          if (allowed.has(node.tagName)) {
            const element = document.createElement(node.tagName.toLowerCase());
            element.append(fragment);
            result = element;
          }
          // Rich text copied from office tools often represents emphasis as CSS.
          if (node.tagName === 'SPAN') {
            const styles = node.style;
            const wrappers = [];
            if (styles.fontWeight === 'bold' || Number.parseInt(styles.fontWeight, 10) >= 600) wrappers.push('strong');
            if (styles.fontStyle === 'italic') wrappers.push('em');
            if (styles.textDecorationLine.includes('underline') || styles.textDecoration.includes('underline')) wrappers.push('u');
            for (const tag of wrappers) { const wrapper = document.createElement(tag); wrapper.append(result); result = wrapper; }
          }
          return result;
        }
        const result = document.createDocumentFragment();
        for (const child of template.content.childNodes) result.append(clean(child));
        return result;
      }

      function toPlainText() {
        // Let the browser resolve visible line breaks. Joining DOM text manually
        // loses boundaries such as: first line<div>second line</div>.
        const snapshot = editor.cloneNode(true);
        snapshot.removeAttribute('id');
        snapshot.removeAttribute('contenteditable');
        snapshot.removeAttribute('role');
        snapshot.setAttribute('aria-hidden', 'true');
        snapshot.style.cssText = `position:fixed;left:-100000px;top:0;width:${Math.max(editor.clientWidth, 1)}px;white-space:normal;pointer-events:none;`;
        // List markers are not part of innerText; make them explicit in this
        // temporary copy while leaving the editable note and rich HTML intact.
        for (const list of snapshot.querySelectorAll('ul,ol')) list.style.listStyle = 'none';
        for (const item of snapshot.querySelectorAll('li')) {
          const list = item.parentElement;
          const siblings = Array.from(list.children).filter(child => child.tagName === 'LI');
          const marker = list.tagName === 'OL' ? `${siblings.indexOf(item) + 1}. ` : '• ';
          item.prepend(document.createTextNode(marker));
        }
        document.body.append(snapshot);
        try {
          // Preserve empty lines and trailing line breaks instead of collapsing
          // or trimming them. The browser normalizes paragraph and BR boundaries.
          return snapshot.innerText.replace(/\u00a0/g, ' ');
        } finally {
          snapshot.remove();
        }
      }

      function formattedHtml() {
        const container = document.createElement('div');
        container.append(cleanFragment(editor.innerHTML));
        return container.innerHTML;
      }

      function fallbackCopy(html, text) {
        restoreSelection();
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(editor);
        selection.removeAllRanges();
        selection.addRange(range);
        const onCopy = event => {
          if (!event.clipboardData) return;
          event.clipboardData.setData('text/plain', text);
          event.clipboardData.setData('text/html', html);
          event.preventDefault();
        };
        document.addEventListener('copy', onCopy);
        let success = false;
        try { success = document.execCommand('copy'); }
        catch (_) { /* Show the manual alternative below. */ }
        finally { document.removeEventListener('copy', onCopy); }
        if (success) restoreSelection();
        return success;
      }

      toolbar.addEventListener('mousedown', event => {
        if (event.target.closest('button')) event.preventDefault();
      });
      toolbar.addEventListener('click', event => {
        const button = event.target.closest('[data-command]');
        if (!button) return;
        restoreSelection();
        // execCommand retains the browser's edit/undo history for this simple editor.
        document.execCommand(button.dataset.command, false, null);
        changed();
      });
      document.addEventListener('selectionchange', () => {
        const selection = window.getSelection();
        if (selection && editor.contains(selection.anchorNode)) { rememberSelection(); refreshToolbar(); }
      });
      editor.addEventListener('input', changed);
      editor.addEventListener('keydown', event => {
        if (!(event.ctrlKey || event.metaKey) || event.altKey) return;
        const command = { b:'bold', i:'italic', u:'underline' }[event.key.toLowerCase()];
        if (!command) return;
        event.preventDefault();
        document.execCommand(command, false, null);
        changed();
      });
      editor.addEventListener('paste', event => {
        event.preventDefault();
        const clipboard = event.clipboardData;
        if (!clipboard) return;
        const richText = clipboard.getData('text/html');
        restoreSelection();
        if (richText) {
          const container = document.createElement('div');
          container.append(cleanFragment(richText));
          document.execCommand('insertHTML', false, container.innerHTML);
        } else {
          document.execCommand('insertText', false, clipboard.getData('text/plain'));
        }
        changed();
      });
      editor.addEventListener('drop', event => event.preventDefault());
      copyButton.addEventListener('mousedown', rememberSelection);
      copyButton.addEventListener('click', async () => {
        const text = toPlainText();
        if (!text.trim()) { message('Bitte zuerst eine Notiz eingeben.'); editor.focus(); return; }
        const html = formattedHtml();
        copyButton.disabled = true;
        let success = false;
        try {
          if (window.isSecureContext && navigator.clipboard?.write && window.ClipboardItem) {
            await navigator.clipboard.write([new ClipboardItem({
              'text/plain': new Blob([text], { type:'text/plain' }),
              'text/html': new Blob([html], { type:'text/html' })
            })]);
            success = true;
          }
        } catch (_) { /* Browser or iFrame policy may require the copy-event fallback. */ }
        if (!success) success = fallbackCopy(html, text);
        copyButton.disabled = false;
        message(success ? 'Gesamte Notiz kopiert.' : 'Automatisches Kopieren blockiert. Die Notiz ist markiert: bitte Strg+C drücken.', !success);
      });
      window.addEventListener('pagehide', saveDraft);
    })();
  </script>
</body>
</html>
